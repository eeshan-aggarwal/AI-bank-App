name: Deploy to server
on:
    workflow_call:

jobs:
    deploy-to-server:
        runs-on: ubuntu-latest
        env:
            DOCKER_USERNAME: ${{ vars.DOCKERHUB_USER }}
            DOCKER_TAG: ${{ github.event.workflow_run.head_sha }}

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: SSH to server
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC2_SSH_HOST }}
            username: ${{ secrets.EC2_SSH_USER }}
            key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
            scripts: |
                echo "Creating empty directory"
                sudo apt-get update && sudo apt-get install docker.io docker-compose-v2 -y
                sudo usermod -aG docker $USER
                rm -rf AI-Bank-App && mkdir -p AI-Bank-App

        - name: Copy docker compose file
          uses: appleboy/scp-action@v1
          with:
            host: ${{ secrets.EC2_SSH_HOST }}
            username: ${{ secrets.EC2_SSH_USER }}
            key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
            source: docker-compose.yml
            target: ~/AI-Bank-App

        - name: SSH to server
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC2_SSH_HOST }}
            username: ${{ secrets.EC2_SSH_USER }}
            key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
            scripts: |
                echo "Running app"
                echo ${{ secrets.GITHUB_TOKEN }} | docker login --username $DOCKERHUB_USERNAME --password-stdin
                cd ~/AI-Bank-App && docker compose down && docker compose up -d --build --force-recreate --pull always